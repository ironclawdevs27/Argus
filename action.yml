name: 'Argus PR Validator'
description: 'Targeted QA audit on routes affected by a pull request. Blocks merge on critical or warning findings.'
author: 'ironclawdevs27'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  target-url:
    description: |
      Base URL of the running application to audit (e.g. https://staging.example.com).
      The application must already be running and reachable from the runner before this action starts.
      Acts as the fallback target: when preview-url is set, or detect-preview finds a live
      per-PR deploy preview, that preview is audited instead and this URL is used only if no
      preview is found. For a simple deploy-preview workflow, pass the preview URL here directly.
    required: true

  preview-url:
    description: |
      Explicit per-PR deploy-preview URL to audit instead of target-url (e.g. a Vercel/Netlify
      preview URL resolved by a prior step). Takes precedence over target-url; leave empty to use
      target-url or detect-preview.
    required: false
    default: ''

  detect-preview:
    description: |
      Set to "true" to auto-detect the PR's deploy-preview URL from its GitHub Deployments
      (Vercel / Netlify / any GitHub Deployment) using the PR head SHA, degrading gracefully to
      target-url when no live preview is found. Off by default.
    required: false
    default: ''

  github-token:
    description: 'GitHub token for fetching the PR file list. Defaults to the workflow GITHUB_TOKEN. Required for private repositories.'
    required: false
    default: ${{ github.token }}

  block-on:
    description: |
      Severity level that blocks the merge:
        critical — block only when critical findings exist (default)
        warning  — block on any warning or critical finding
        none     — never block (report-only mode)
    required: false
    default: 'critical'

  pr-url:
    description: 'Full GitHub PR URL (e.g. https://github.com/owner/repo/pull/42). Auto-detected from the workflow pull_request event context when not provided.'
    required: false
    default: ''

  routes-file:
    description: |
      Path to a routes JSON file (workspace-relative or absolute) containing an array of
      {path, name} objects, e.g. [{"path":"/","name":"Home"},{"path":"/login","name":"Login"}].
      When omitted, Argus looks for argus.routes.json in the workspace root (requires checkout),
      then falls back to auditing the root path (/) only.
      Recommended: commit an argus.routes.json to your repo so CI always knows which pages to test.
    required: false
    default: ''

  route-timeout:
    description: |
      Per-route audit timeout in milliseconds (default 120000). A route whose audit exceeds this
      is recorded as a failed route — a hung audit can never silently pass. Set 0 to disable the
      bound. Raise it if you enable a deeper audit (audit-depth) on heavy pages.
    required: false
    default: ''

  route-retries:
    description: |
      Number of times to retry a failed or timed-out route audit before recording it as a failure
      (default 0, max 5). Retries are immediate; use for flaky targets.
    required: false
    default: ''

  chrome-flags:
    description: 'Extra flags to pass to Chrome at startup, space-separated (e.g. "--disable-web-security --window-size=1920,1080").'
    required: false
    default: ''

  node-version:
    description: 'Node.js version to use.'
    required: false
    default: '20'

outputs:
  blocked:
    description: '"true" if findings at or above the block-on severity were found, "false" otherwise.'
    value: ${{ steps.audit.outputs.blocked }}

  critical-count:
    description: 'Total number of critical-severity findings across all audited routes.'
    value: ${{ steps.audit.outputs.critical_count }}

  warning-count:
    description: 'Total number of warning-severity findings across all audited routes.'
    value: ${{ steps.audit.outputs.warning_count }}

  affected_routes:
    description: 'Comma-separated list of route paths that were audited (e.g. "/,/login,/checkout").'
    value: ${{ steps.audit.outputs.affected_routes }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install argusqa-os
      shell: bash
      run: npm install -g argusqa-os@10.0.0 chrome-devtools-mcp@1.1.1

    - name: Launch Chrome
      shell: bash
      env:
        ARGUS_CHROME_FLAGS: ${{ inputs.chrome-flags }}
      run: |
        # Resolve the Chrome binary — try common names in order.
        CHROME_BIN=$(command -v google-chrome 2>/dev/null \
                  || command -v google-chrome-stable 2>/dev/null \
                  || command -v chromium-browser 2>/dev/null \
                  || command -v chromium 2>/dev/null \
                  || true)

        if [ -z "$CHROME_BIN" ]; then
          echo "::error::No Chrome or Chromium binary found on this runner."
          echo "::error::Install it before this step, e.g.:"
          echo "::error::  sudo apt-get update && sudo apt-get install -y google-chrome-stable"
          exit 1
        fi

        echo "[argus] Using Chrome binary: $CHROME_BIN"

        # Split extra flags on whitespace only — prevents shell injection via semicolons/pipes
        read -ra CHROME_EXTRA_FLAGS <<< "${ARGUS_CHROME_FLAGS:-}"
        "$CHROME_BIN" \
          --remote-debugging-port=9222 \
          --headless=new \
          --no-sandbox \
          --disable-gpu \
          --disable-dev-shm-usage \
          --user-data-dir=/tmp/argus-chrome \
          "${CHROME_EXTRA_FLAGS[@]}" &

        echo "[argus] Waiting for Chrome DevTools Protocol to be ready..."
        for i in $(seq 1 20); do
          curl -sf http://localhost:9222/json/version >/dev/null 2>&1 && break
          sleep 0.5
        done

        if ! curl -sf http://localhost:9222/json/version >/dev/null 2>&1; then
          echo "::error::Chrome failed to start on port 9222 after 10 seconds."
          exit 1
        fi

        echo "[argus] Chrome is ready."

    - name: Run PR audit
      id: audit
      shell: bash
      env:
        TARGET_DEV_URL: ${{ inputs.target-url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ARGUS_BLOCK_ON: ${{ inputs.block-on }}
        # Deploy-preview auto-detection (D3): an explicit preview URL, or opt-in detection of the
        # PR's GitHub Deployment preview (keyed on ARGUS_PR_HEAD_SHA below). Both fail safe to
        # TARGET_DEV_URL — empty by default → no behaviour change.
        ARGUS_PREVIEW_URL: ${{ inputs.preview-url }}
        ARGUS_PREVIEW_DETECT: ${{ inputs.detect-preview }}
        ARGUS_PR_URL: ${{ inputs.pr-url != '' && inputs.pr-url || format('https://github.com/{0}/pull/{1}', github.repository, github.event.pull_request.number) }}
        ARGUS_ROUTES_FILE: ${{ inputs.routes-file }}
        # PR head SHA for the Argus Check Run. The runner's default GITHUB_SHA on a
        # pull_request event is the ephemeral merge commit; the Check Run must attach to the
        # PR head so it shows on the PR's Checks tab. (Posting the comment + Check Run
        # requires the consuming workflow to grant `pull-requests: write` + `checks: write`.)
        ARGUS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Baseline-aware blocking (optional): the PR's target branch. When a baseline file for
        # this branch is present under REPORT_OUTPUT_DIR/baselines/ (restore it with
        # actions/cache + a base-branch run that sets ARGUS_UPDATE_BASELINE=1), Argus blocks on
        # the findings the PR INTRODUCES rather than pre-existing ones. With no baseline present
        # it fails safe to blocking on absolute counts — so this is a no-op by default.
        GITHUB_BASE_REF: ${{ github.base_ref }}
        # Per-route audit timeout + retry (D4). Empty → the built-in defaults (120000 ms, 0
        # retries). A timed-out route is counted as a failed route, so a hung audit blocks the
        # merge rather than silently passing.
        ARGUS_ROUTE_TIMEOUT_MS: ${{ inputs.route-timeout }}
        ARGUS_ROUTE_RETRIES: ${{ inputs.route-retries }}
        ARGUS_RETRY_ATTEMPTS: '2'
        MCP_BROWSER_URL: 'http://127.0.0.1:9222'
        REPORT_OUTPUT_DIR: '/tmp/argus-reports'
      run: |
        mkdir -p /tmp/argus-reports
        argus-pr-validate
